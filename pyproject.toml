[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "visionguard"
version = "0.1.0"
description = "Visual inspection workspace with learned surface anomaly localization and human review"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.119,<1", "uvicorn[standard]>=0.37,<1", "httpx>=0.28,<1", "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.10,<3", "python-multipart>=0.0.20", "pyjwt[crypto]>=2.10,<3", "Pillow>=12,<14", "numpy>=2.2,<3", "scipy>=1.15,<2", "scikit-learn>=1.7,<2", "onnxruntime>=1.22,<2"]
[project.optional-dependencies]
vision = ["torch>=2.6,<3", "torchvision>=0.21,<1", "safetensors>=0.6,<1", "onnx>=1.17,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1", "playwright>=1.50,<2"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
visionguard = ["web/*", "web/assets/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]
